plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Mapbox public token — never commit. Set in android/local.properties:
//   mapbox.access.token=…
// or export MAPBOX_ACCESS_TOKEN (CI / shell).
def mapboxAccessToken =
        localProperties.getProperty('mapbox.access.token')
                ?: System.getenv('MAPBOX_ACCESS_TOKEN')
                ?: ''

android {
    namespace "com.example.verygoodcore.waze_kibris"
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.example.verygoodcore.waze_kibris"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // firebase-auth (and related Firebase Android SDKs) require minSdk 23+.
        minSdkVersion Math.max(flutter.minSdkVersion.toInteger(), 23)
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled = true
        resValue "string", "mapbox_access_token", mapboxAccessToken
    }

    lintOptions {
        // Suppress lint errors for missing POST_NOTIFICATIONS permission
        // We've added the permission to AndroidManifest.xml but lint doesn't detect it in plugin dependencies
        disable 'MissingPermission'
        checkReleaseBuilds false
        abortOnError false
    }

//    signingConfigs {
//        if (System.getenv("ANDROID_KEYSTORE_PATH")) {
//            release {
//                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
//                keyAlias System.getenv("ANDROID_KEYSTORE_ALIAS")
//                keyPassword System.getenv("ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD")
//                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
//            }
//        } else {
//            release {
//                keyAlias keystoreProperties['keyAlias']
//                keyPassword keystoreProperties['keyPassword']
//                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
//                storePassword keystoreProperties['storePassword']
//            }
//        }
//    }

    signingConfigs {
        release {
            storeFile file('your_key_store_path')
            storePassword 'your_store_password'
            keyAlias = 'your_key_alias'
            keyPassword 'your_key_password'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug

//            signingConfig signingConfigs.release
        }
    }



    flavorDimensions "default"
    productFlavors { 
        production {
            dimension "default"
            applicationIdSuffix ""
            manifestPlaceholders = [appName: "Waze Kibris"]
        }
        staging {
            dimension "default"
            applicationIdSuffix ".stg"
            manifestPlaceholders = [appName: "[STG] Waze Kibris"]
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            manifestPlaceholders = [appName: "[DEV] Waze Kibris"]
        }
    }

//    buildTypes {
